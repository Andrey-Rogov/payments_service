services:
  postgresql:
    image: postgres
    environment:
        POSTGRES_USERNAME: "postgres"
        POSTGRES_PASSWORD: "admin"
    ports:
      - "15432:5432"
    healthcheck:
        test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres'"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 5s
    volumes:
      - postgre_data:/var/lib/postgresql

  rabbit:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  payment_service:
    build: ./payment_service
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: ${DATABASE_URL}

  payments_consumer:
    build: ./payments_consumer
    depends_on:
      rabbit:
          condition: service_healthy
      postgresql:
          condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      API_KEY: ${API_KEY}

volumes:
  postgre_data:
